<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yonná Galvão | Home</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#000;

    font-family:'Montserrat',sans-serif;

    color:white;
}

/* CONTAINER */

.container{

    width:100%;

    max-width:760px;

    margin:auto;
}

/* HERO */

.hero{

    position:relative;

    overflow:hidden;

    border-radius:35px 35px 0 0;
}

.hero img{

    width:100%;

    display:block;
}

.hero::after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:260px;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.98)
    );
}

/* CARD */

.card{

    width:82%;

    max-width:520px;

    margin:-30px auto 0;

    position:relative;

    z-index:10;

    background:white;

    color:#111;

    border-radius:28px;

    padding:42px 35px;

    text-align:center;

    box-shadow:

    0 20px 60px rgba(0,0,0,.45);
}

/* TÍTULO */

.card h1{

    font-size:52px;

    font-weight:800;

    letter-spacing:5px;
}

.card p{

    font-size:28px;

    margin-top:5px;

    font-weight:500;
}

/* BOTÃO */

.enter{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    height:78px;

    margin:40px 0;

    background:#242424;

    color:white;

    border-radius:40px;

    text-decoration:none;

    font-size:30px;

    font-weight:700;

    letter-spacing:6px;

    transition:.35s;
}

.enter:hover{

    background:#3a3a3a;

    transform:translateY(-3px);

    box-shadow:0 12px 30px rgba(0,0,0,.30);
}

/* FRASE */

.frase{

    font-size:18px;

    font-weight:700;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:30px;
}

/* RODAPÉ */

.copy{

    font-size:13px;

    color:#666;

    letter-spacing:2px;
}

/* MOBILE */

@media(max-width:768px){

.card{

    width:88%;

    padding:30px 25px;

    margin-top:-25px;
}

.card h1{

    font-size:28px;

    letter-spacing:2px;
}

.card p{

    font-size:16px;
}

.enter{

    height:58px;

    font-size:18px;

    letter-spacing:3px;

    margin:28px 0;
}

.frase{

    font-size:12px;

    letter-spacing:2px;
}

.copy{

    font-size:10px;
}

}

</style>

</head>

<body>

<div class="container">

    <section class="hero">

        <!-- mesmo fundo da index -->
        <img src="home/hero.jpg">

    </section>

    <div class="card">

        <h1>YONNÁ GALVÃO</h1>

        <p>Exclusive</p>

        <a href="exclusivecontent.html" class="enter">

            ENTER

        </a>

        <div class="frase">

            CLICK AND DISCOVER A NEW WORLD.

        </div>

        <div class="copy">

            Yonna Galvão © 2026 - Todos os direitos reservados

        </div>

    </div>

</div>

</body>

</html>
